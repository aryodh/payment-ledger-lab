spring.application.name=payment-ledger-lab
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://localhost:${LEDGER_DB_PORT:5432}/ledger?currentSchema=ledger
spring.datasource.username=ledger_app
spring.datasource.password=${LEDGER_APP_DB_PASSWORD}
spring.jackson.property-naming-strategy=SNAKE_CASE
# Reject 1.5 or "100" for an amount instead of coercing it.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
# Platform fee in basis points of the payment amount, fixed when a payment is accepted.
ledger.platform-fee-bps=300

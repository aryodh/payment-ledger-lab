services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      LEDGER_MIGRATOR_DB_PASSWORD: ${LEDGER_MIGRATOR_DB_PASSWORD:?copy .env.example to .env}
      LEDGER_APP_DB_PASSWORD: ${LEDGER_APP_DB_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${LEDGER_DB_PORT:-5432}:5432"
    volumes:
      - ledger-data:/var/lib/postgresql
      - ./db/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      # Over TCP, because the temporary server that runs init scripts only listens on a socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: flyway/flyway:13.12.1-alpine@sha256:6af6ece9c5d46f62db7409dc19992d34886cd6376ddd81dbff23d5e03708cff9
    depends_on:
      postgres:
        condition: service_healthy
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/ledger
      FLYWAY_USER: ledger_migrator
      FLYWAY_PASSWORD: ${LEDGER_MIGRATOR_DB_PASSWORD:?copy .env.example to .env}
      FLYWAY_SCHEMAS: ledger
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro

volumes:
  ledger-data:
